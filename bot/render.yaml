services:
  - type: web
    name: gemini-whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: PAIRING_PHONE_NUMBER
        sync: false
      - key: OWNER_NUMBER
        sync: false
