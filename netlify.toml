[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "OWNER_EMAIL,NODE_ENV,ENABLE_SELF_PING,OWNER_NUMBER,OPENROUTER_MODEL,APP_URL,SELF_PING_URL"

[functions]
  node_bundler = "esbuild"
  included_files = ["firebase-applet-config.json"]
  external_node_modules = ["firebase-admin"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
