[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  SECRETS_SCAN_OMIT_KEYS = "OWNER_EMAIL,NODE_ENV,ENABLE_SELF_PING,OWNER_NUMBER,OPENROUTER_MODEL,APP_URL,SELF_PING_URL,PORT,RESEND_FROM_EMAIL,TELEGRAM_BOT_USERNAME,NODE_VERSION,AWS_LAMBDA_JS_RUNTIME"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,security_spec.md,setup-termux.sh,Dockerfile,render.yaml,bot/render.yaml"

[functions]
  node_bundler = "esbuild"
  included_files = ["firebase-applet-config.json"]
  external_node_modules = ["firebase-admin", "@google/genai", "serverless-http", "express", "nodemailer", "dotenv", "playwright-core"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
